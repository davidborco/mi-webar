<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Mi Experiencia WebAR - Romanito</title>
  
  <!-- 1. Motor 3D de A-Frame (Versión estable) -->
  <script src="https://cloudflare.com"></script>
  
  <!-- 2. Motor AR.js oficial unificado y compatible con A-Frame 1.3.0 -->
  <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Escena configurada correctamente con la webcam y texturas de video activas -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <!-- Archivo de tu amigurumi -->
      <img id="mi-imagen-cuadrada" src="romanito1.jpg">
    </a-assets>

    <!-- Renderizamos el plano con tu foto a una distancia cómoda -->
    <a-plane 
      src="#mi-imagen-cuadrada" 
      position="0 1.5 -2.5" 
      rotation="0 0 0" 
      width="1.8" 
      height="1.8"
      material="shader: flat; transparent: true;">
    </a-plane>

    <!-- La cámara sincronizada con la webcam física -->
    

  </a-scene>

</body>
</html>
