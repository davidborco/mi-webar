<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Mi Experiencia WebAR - Romanito</title>
  
  <!-- 1. Motor 3D de A-Frame (Versión estable compatible con AR) -->
  <script src="https://cloudflare.com"></script>
  
  <!-- 2. Motor de Realidad Aumentada de AR.js (CDN Oficial estable) -->
  <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Inicializamos la escena WebAR con la cámara real activa -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <!-- Tu imagen con su nombre corto perfecto -->
      <img id="mi-imagen-cuadrada" src="romanito1.jpg">
    </a-assets>

    <!-- Dibujamos tu foto en el espacio 3D -->
    <!-- Position: X=0 (centro), Y=1.5 (altura ojos), Z=-2.5 (a 2 metros y medio de ti) -->
    <a-plane 
      src="#mi-imagen-cuadrada" 
      position="0 1.5 -2.5" 
      rotation="0 0 0" 
      width="1.8" 
      height="1.8"
      material="shader: flat; transparent: true;">
    </a-plane>

    <!-- Sincroniza el punto de vista con la cámara física del celular -->
    

  </a-scene>

</body>
</html>
